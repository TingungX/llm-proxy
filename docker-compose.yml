services:
  llm-proxy:
    build: .
    container_name: llm-proxy
    ports:
      - "4000:4000"
    volumes:
      - ./usage.db:/app/usage.db
      - ./config.json:/app/config.json
      # 日志挂载到宿主机：logging_config.py 统一写 /app/logs/llm-proxy.log
      - ./logs:/app/logs
    environment:
      # 日志级别：INFO 使 lifecycle/access_log 可见，ERROR 只保留错误
      - LLM_PROXY_LOG_LEVEL=INFO
      # 日志文件路径（容器内）——与宿主机 ./logs 通过 volume 映射
      - LLM_PROXY_LOG_FILE=/app/logs/llm-proxy.log
      # 显式声明 DB 路径
      - LLM_PROXY_DB_PATH=/app/usage.db
      # 走 Steam++ (Watt Toolkit) 代理访问被墙上游（opencode.ai 等）
      - HTTPS_PROXY=http://host.docker.internal:1082
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "/app/docker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # 不限制资源——llm-proxy 是 IO 密集型
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
